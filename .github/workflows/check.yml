name: check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 説明文 160 字以内。超過が 1 件でもあれば exit 1
      - name: 説明文の長さ
        run: python tools/check_desc.py
      # 語彙外のタグ・data-tags の欠落・誰も使っていないチップ
      # 前段が落ちても両方の結果を一度に見たいので always()
      - name: 技術タグの整合
        if: always()
        run: python tools/check_tags.py
      # 語彙外の出典・data-src の欠落・誰も使っていないチップ
      - name: 出典タグの整合
        if: always()
        run: python tools/check_src.py
      # カテゴリ軸の構造。cat の重複・チップと棚の食い違い・同名カテゴリ・空の棚
      # 2026-09-01 に cat15 が 🎨 と 🖼️ で二重定義されたまま通った穴を塞ぐもの
      - name: カテゴリ軸の構造
        if: always()
        run: python tools/check_cats.py
      # 実装ライブラリ(data-lib)の役割と語彙。--measure は付けない ——
      # 兄弟リポジトリの実測との突き合わせは、別リポジトリ(9 件は private)を
      # 読む必要があり CI からは見えない。手元で走らせる検査。
      - name: 実装ライブラリの整合
        if: always()
        run: python tools/check_lib.py
