name: check

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # V1 の検査 5 本(説明文の長さ・技術タグ・出典・カテゴリ構造・実装ライブラリ)は
      # 対象が index.html から data/apps.json へ移ったのでこの 1 本に畳んである。
      # id 重複・必須項目・未定義 taxonomy・URL/日付の形式・featuredOrder の重複・
      # githubUrl の食い違い・summary 160 字・誰も使っていない語彙。
      - name: apps.json の検査
        run: python scripts/validate_apps.py --verbose
      # 陽性対照。**緑になる検査は赤にできることを見ていないと意味がない** ——
      # わざと 12 通りに壊した apps.json を作り、全部 exit 1 になることと、
      # 無傷なら 0 になることを確かめる。
      - name: 検査そのものの検査(陽性対照)
        if: always()
        run: python scripts/selftest_validate.py
      # 画面の JSON がそのまま読めること(壊れた JSON を配らない)
      - name: データが JSON として読めるか
        if: always()
        run: |
          python -c "import json;[json.load(open(p,encoding='utf-8')) for p in ['data/apps.json','data/taxonomy.json','data/search-synonyms.json']];print('3 ファイルとも読めた')"
